name: Deploy to GitHub Pages

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Mỗi nhánh một hàng đợi: push `main` không hủy workflow `release` (tránh deploy nhầm base).
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # main → /repo/ (github.io/.../repo/). release → / (custom domain gốc).
      - name: Set PAGES_BASE
        id: pages_base
        run: |
          if [ "${GITHUB_REF_NAME}" = "release" ]; then
            echo "value=root" >> "$GITHUB_OUTPUT"
          else
            echo "value=repository" >> "$GITHUB_OUTPUT"
          fi
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME} → PAGES_BASE=$(grep '^value=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Build
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.pages_base.outputs.value }}

      - name: Verify root base on release
        if: github.ref_name == 'release'
        run: |
          if ! grep -q 'src="/assets/' dist/index.html; then
            echo "release build must use base=/ (expect src=\"/assets/...\" in dist/index.html):"
            grep -E 'src=|href=' dist/index.html || cat dist/index.html
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

